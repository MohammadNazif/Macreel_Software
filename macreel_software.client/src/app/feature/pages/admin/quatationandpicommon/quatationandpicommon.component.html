<div class="bg-white rounded-xl shadow-sm p-5 mb-6 border border-gray-100">
  <div class="flex justify-between items-center mb-4">
    <h3 class="text-sm font-semibold text-gray-700">Client Information</h3>
    <button (click)="showCompanyModal = true"
      class="bg-[#E6354B]/10 text-[#E6354B] px-3 py-1.5 rounded-lg hover:bg-[#E6354B]/20 text-xs font-medium transition">
      + Add New Company
    </button>
  </div>

  <div class="grid md:grid-cols-3 gap-4">
    <div *ngFor="let field of clientFields">
      <label class="text-xs text-gray-600">{{ field.label }}</label>
      <ng-container [ngSwitch]="field.type">
        <input *ngSwitchCase="'text'" type="text"
          class="w-full mt-1 bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm"
          [placeholder]="field.placeholder"
          [readonly]="field.readonly"
          [(ngModel)]="field.value" />

        <select *ngSwitchCase="'select'"
          class="w-full mt-1 border border-gray-200 rounded-lg px-3 py-2 text-sm
          focus:ring-2 focus:ring-[#E6354B]/40 focus:border-[#E6354B] outline-none transition"
    
          [(ngModel)]="field.value">
           <option value="" disabled selected hidden>{{ "---"+field.placeholder+ "---" || '-- Select --' }}</option>
          <option *ngFor="let option of field.options" [value]="option.value">{{ option.label }}</option>
        </select>
      </ng-container>
    </div>
  </div>
</div>

<!-- ADD COMPANY MODAL -->
<div *ngIf="showCompanyModal" class="fixed inset-0 z-50 flex items-center justify-center">
  <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" (click)="showCompanyModal = false"></div>

  <div class="relative bg-white w-full max-w-2xl rounded-lg shadow-xl p-4">
    <div class="flex justify-between items-center mb-1">
      <h2 class="text-md font-semibold text-gray-800">Add New Company</h2>
      <button (click)="showCompanyModal = false"
        class="text-gray-400 hover:text-[#E6354B] transition text-base">✕</button>
    </div>
    <hr>

    <div class="space-y-1 text-sm">
      <ng-container *ngFor="let section of modalSections">
        <h4 class="text-[10px] font-semibold text-[#E6354B] mb-1 uppercase tracking-wide">{{ section.title }}</h4>
        <div class="grid" [ngClass]="section.gridCols">
          <ng-container *ngFor="let field of section.fields">
            <div>
              <label class="text-[10px] text-gray-600">{{ field.label }}</label>
              <ng-container [ngSwitch]="field.type">
                <input *ngSwitchCase="'text'" type="text"
                  class="w-full mt-1 border border-gray-200 rounded px-2 py-1 focus:ring-1 focus:ring-[#E6354B]/40 outline-none text-sm"
                  [placeholder]="field.placeholder"
                  [(ngModel)]="field.value" />

                <select *ngSwitchCase="'select'"
                  class="w-full mt-1 border border-gray-200 rounded px-2 py-1 focus:ring-1 focus:ring-[#E6354B]/40 outline-none text-sm"
                  [(ngModel)]="field.value">
                  <option *ngFor="let option of field.options" [value]="option.value">{{ option.label }}</option>
                </select>

                <textarea *ngSwitchCase="'textarea'" rows="2"
                  class="w-full mt-1 border border-gray-200 rounded px-2 py-1 focus:ring-1 focus:ring-[#E6354B]/40 outline-none text-sm"
                  [placeholder]="field.placeholder"
                  [(ngModel)]="field.value"></textarea>
              </ng-container>
            </div>
          </ng-container>
        </div>
      </ng-container>
    </div>

    <div class="mt-4 flex justify-end gap-2">
      <button (click)="saveCompany()"
        class="px-4 py-1.5 rounded bg-[#E6354B] text-white text-xs hover:bg-[#cc2e42] transition shadow-sm">
        Save Company
      </button>
    </div>
  </div>
</div>

<!-- PRODUCTS / SERVICES CARD -->
<div class="bg-white rounded-xl shadow-sm p-5 mb-6 border border-gray-100">
  <div class="flex justify-between items-center mb-4">
    <h3 class="text-sm font-semibold text-gray-700">Products / Services</h3>
    <button (click)="addProduct()" class="bg-[#E6354B]/10 text-[#E6354B] px-3 py-1.5 rounded-lg hover:bg-[#E6354B]/20 text-xs font-medium transition">
      + Add Item
    </button>
  </div>

  <div class="overflow-x-auto">
    <table class="w-full text-sm">
      <thead>
        <tr class="text-left text-gray-500 border-b bg-gray-50 text-xs uppercase tracking-wide">
          <th class="py-2 px-3">Item</th>
          <th class="py-2 px-3">Price</th>
          <th class="py-2 px-3">Qty</th>
          <th class="py-2 px-3">Total</th>
          <th class="py-2 px-3">Note</th>
          <th class="py-2 px-3 text-center">AMC</th>
          <th class="py-2 px-3 text-center">Renew</th>
          <th class="py-2 px-3 text-center">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let product of products; let i = index" class="border-b hover:bg-gray-50 transition">
          <td class="py-2 px-3"><input type="text" [(ngModel)]="product.name" placeholder="Name" class="w-36 border rounded-md px-2 py-1.5 text-sm"></td>
          <td class="py-2 px-3"><input type="number" [(ngModel)]="product.price" placeholder="0.00" class="w-24 border rounded-md px-2 py-1.5 text-sm"></td>
          <td class="py-2 px-3"><input type="number" [(ngModel)]="product.qty" placeholder="1" class="w-16 border rounded-md px-2 py-1.5 text-sm"></td>
          <td class="py-2 px-3 font-medium text-gray-800">₹ {{ rowTotal(product) | number:'1.2-2' }}</td>
          <td class="py-2 px-3"><input type="text" [(ngModel)]="product.note" placeholder="Optional" class="w-40 border rounded-md px-2 py-1.5 text-sm"></td>
          <td class="py-2 px-3 text-center"><input type="checkbox" [(ngModel)]="product.amc" class="h-4 w-4 text-[#E6354B] rounded focus:ring-[#E6354B]"></td>
          <td class="py-2 px-3 text-center"><input type="checkbox" [(ngModel)]="product.renew" class="h-4 w-4 text-[#E6354B] rounded focus:ring-[#E6354B]"></td>
          <td class="py-2 px-3 text-center"><button (click)="removeProduct(i)" class="text-[#E6354B] hover:text-[#cc2e42] text-xs font-medium">Remove</button></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
